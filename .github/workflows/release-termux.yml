name: Build Termux Binaries

on:
  push:
    tags:
      - "v*-termux"
  workflow_dispatch:

jobs:
  build-termux:
    name: Build Solana Binaries for Termux (Android aarch64)
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠 Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: 📋 Check and add Android target
        run: |
          # Force add the target in case rust-toolchain.toml overrides it
          rustup target add aarch64-linux-android --toolchain stable
          rustup show

      - name: 📦 Set up Android NDK
        run: |
          # Install Android NDK
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          export ANDROID_NDK_ROOT=$PWD/android-ndk-r26d
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: ⚙️ Set up Cargo linker config
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-linux-android]' >> .cargo/config.toml
          echo 'linker = "aarch64-linux-android21-clang"' >> .cargo/config.toml
          echo '' >> .cargo/config.toml
          echo '[env]' >> .cargo/config.toml
          echo 'CC_aarch64_linux_android = "aarch64-linux-android21-clang"' >> .cargo/config.toml
          echo 'CXX_aarch64_linux_android = "aarch64-linux-android21-clang++"' >> .cargo/config.toml
          echo 'AR_aarch64_linux_android = "llvm-ar"' >> .cargo/config.toml
          echo 'RANLIB_aarch64_linux_android = "llvm-ranlib"' >> .cargo/config.toml

      - name: 🔐 Set up OpenSSL for Android
        run: |
          # Set environment variables for OpenSSL cross-compilation
          echo "OPENSSL_STATIC=1" >> $GITHUB_ENV
          echo "OPENSSL_NO_VENDOR=1" >> $GITHUB_ENV
          
          # Build OpenSSL for Android
          git clone --depth 1 --branch OpenSSL_1_1_1w https://github.com/openssl/openssl.git openssl-src
          cd openssl-src
          
          # Configure OpenSSL for Android ARM64
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export CC=aarch64-linux-android21-clang
          export CXX=aarch64-linux-android21-clang++
          export AR=llvm-ar
          export RANLIB=llvm-ranlib
          export STRIP=llvm-strip
          
          ./Configure android-arm64 \
            -D__ANDROID_API__=21 \
            --prefix=$PWD/../openssl-android \
            --openssldir=$PWD/../openssl-android \
            no-shared \
            no-tests
          
          make -j$(nproc)
          make install_sw
          
          cd ..
          echo "OPENSSL_DIR=$PWD/openssl-android" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$PWD/openssl-android/lib" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$PWD/openssl-android/include" >> $GITHUB_ENV

      - name: 🧱 Build release binaries
        run: |
          # Override any rust-toolchain.toml restrictions
          export RUSTUP_TOOLCHAIN=stable
          rustup target add aarch64-linux-android --toolchain stable
          cargo +stable build --release --target aarch64-linux-android --bin solana
          cargo +stable build --release --target aarch64-linux-android --bin solana-test-validator

      - name: 📦 Create tar.xz archive
        run: |
          mkdir -p out
          cp target/aarch64-linux-android/release/solana out/
          cp target/aarch64-linux-android/release/solana-test-validator out/
          tar -cJf solana-termux-binaries.tar.xz -C out .

      - name: 🚀 Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: solana-termux-binaries.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 💾 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: solana-termux-binaries
          path: solana-termux-binaries.tar.xz