name: Build Termux Binaries

on:
  push:
    tags:
      - "v*-termux"
  workflow_dispatch:

jobs:
  build-termux:
    name: Build Solana Binaries for Termux (Android aarch64)
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠 Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: 📋 Check and add Android target
        run: |
          # Force add the target in case rust-toolchain.toml overrides it
          rustup target add aarch64-linux-android --toolchain stable
          rustup show

      - name: 📦 Set up Android NDK
        run: |
          # Install Android NDK
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          export ANDROID_NDK_ROOT=$PWD/android-ndk-r26d
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: ⚙️ Set up Cargo linker config
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-linux-android]' >> .cargo/config.toml
          echo 'linker = "aarch64-linux-android21-clang"' >> .cargo/config.toml
          echo '' >> .cargo/config.toml
          echo '[env]' >> .cargo/config.toml
          echo 'CC_aarch64_linux_android = "aarch64-linux-android21-clang"' >> .cargo/config.toml
          echo 'CXX_aarch64_linux_android = "aarch64-linux-android21-clang++"' >> .cargo/config.toml
          echo 'AR_aarch64_linux_android = "${{ env.ANDROID_NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"' >> .cargo/config.toml
          echo 'RANLIB_aarch64_linux_android = "${{ env.ANDROID_NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"' >> .cargo/config.toml

      - name: 🔐 Set up OpenSSL for Android
        run: |
          # Use vendored OpenSSL to avoid cross-compilation issues
          echo "OPENSSL_STATIC=1" >> $GITHUB_ENV
          echo "OPENSSL_VENDORED=1" >> $GITHUB_ENV
          
          # Additional Android-specific environment variables
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_API_LEVEL=21" >> $GITHUB_ENV
          
          # Set up additional toolchain environment variables
          echo "TARGET_CC=aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "TARGET_CXX=aarch64-linux-android21-clang++" >> $GITHUB_ENV
          echo "TARGET_AR=llvm-ar" >> $GITHUB_ENV
          echo "TARGET_RANLIB=llvm-ranlib" >> $GITHUB_ENV
          
      - name: 🧰 Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          
      - name: 🔍 Debug jemalloc Build
        run: |
          # Check if configure script exists
          ls -la /home/runner/work/solana/solana/target/aarch64-linux-android/release/build/tikv-jemalloc-sys-*/out/build
          # Run configure manually with verbose output
          cd /home/runner/work/solana/solana/target/aarch64-linux-android/release/build/tikv-jemalloc-sys-*/out/build
          CC="aarch64-linux-android21-clang" \
          CFLAGS="-O3 -DANDROID -ffunction-sections -fdata-sections -fPIC -std=gnu89" \
          CPPFLAGS="-O3 -DANDROID -ffunction-sections -fdata-sections -fPIC -std=gnu89" \
          LDFLAGS="-O3 -DANDROID -ffunction-sections -fdata-sections -fPIC -std=gnu89" \
          AR="${{ env.ANDROID_NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" \
          RANLIB="${{ env.ANDROID_NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib" \
          sh ./configure --disable-cxx --with-jemalloc-prefix=_rjem_ --with-private-namespace=_rjem_ --host=aarch64-linux-android --build=x86_64-unknown-linux-gnu --prefix=/home/runner/work/solana/solana/target/aarch64-linux-android/release/build/tikv-jemalloc-sys-*/out || echo "Configure failed"

      - name: 🧱 Build release binaries
        env:
          CFLAGS_aarch64_linux_android: "-std=gnu89"
          CC_aarch64_linux_android: "aarch64-linux-android21-clang"
          AR_aarch64_linux_android: "${{ env.ANDROID_NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          RANLIB_aarch64_linux_android: "${{ env.ANDROID_NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: "aarch64-linux-android21-clang"
        run: |
          export RUSTUP_TOOLCHAIN=stable
          rustup target add aarch64-linux-android --toolchain stable
          cargo +stable build --release --target aarch64-linux-android --bin solana
          cargo +stable build --release --target aarch64-linux-android --bin solana-test-validator

      - name: 📦 Create tar.xz archive
        run: |
          mkdir -p out
          cp target/aarch64-linux-android/release/solana out/
          cp target/aarch64-linux-android/release/solana-test-validator out/
          tar -cJf solana-termux-binaries.tar.xz -C out .

      - name: 🚀 Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: solana-termux-binaries.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 💾 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: solana-termux-binaries
          path: solana-termux-binaries.tar.xz